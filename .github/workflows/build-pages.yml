#
# Route shells are static files, but TrackRadar keeps moving: new artists need a
# new /artist/<id>/index.html to answer 200 (and therefore be indexable), and
# track counts in each shell's <head> go stale. This job regenerates them and
# commits only when something actually changed.
#
# The site itself stays build-free: nothing here runs in the browser.
name: build-pages

on:
  schedule:
    - cron: '*/5 * * * *'     # 5 min is GitHub's floor; delivery is best-effort
  workflow_dispatch:
  push:
    branches: [main]
    paths:                     # the shell template, its data sources, and every versioned asset
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'tools/build-pages.py'
      - 'tools/version-assets.py'

concurrency:
  group: build-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache-bust any changed css/js before the template is copied into every
      # route shell, so a returning visitor's browser fetches the new bytes.
      - name: Refresh asset version query strings
        run: python3 tools/version-assets.py

      # Scheduled runs skip the full rebuild when upstream has not moved;
      # a manual run or a template change always regenerates.
      - name: Generate route shells and sitemap
        run: python3 tools/build-pages.py ${{ github.event_name == 'schedule' && '--if-changed' || '' }}

      - name: Commit if changed
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "shells already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: 重新產生路由 shell 與 sitemap'
          git push
