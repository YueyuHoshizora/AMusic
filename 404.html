<!DOCTYPE html>

<!-- GitHub Pages serves this with a real 404 status. It deliberately does NOT
     redirect to the app: a redirect would turn every dead URL into a soft 404
     and let crawlers index junk paths as duplicates of the home page. -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="robots" content="noindex, follow">
<title>找不到頁面 · 聽見音樂 A-Music</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/" aria-label="A-Music">
      <img class="brand-mark" src="/assets/logo.svg" alt="" width="36" height="36">
      <span class="brand-text">
        <strong class="brand-name">聽見音樂</strong>
        <span class="brand-sub">A-Music</span>
      </span>
    </a>
  </div>
</header>

<main id="main" class="app">
  <div class="view">
    <section class="page-head">
      <h1>找不到頁面 · Page not found · ページが見つかりません</h1>
      <p class="lede">這個網址不存在。<br>This address does not exist.<br>この URL は存在しません。</p>
      <p><a class="btn primary" href="/">回到首頁 · Home · ホーム</a></p>
    </section>
  </div>
</main>
</body>
</html>
